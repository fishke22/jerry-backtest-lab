name: JNU NikkeiRealtime Transport Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jnu-nikkeirealtime-transport-probe-v1.yml"
      - "scripts/probe_nikkeirealtime_transport_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe raw public transport code
        run: |
          python scripts/probe_nikkeirealtime_transport_v1.py > nrt_probe.log
          tail -c 60000 nrt_probe.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jnu-nrt-transport-probe-${{ github.run_id }}
          path: nrt_probe.log
          retention-days: 7
