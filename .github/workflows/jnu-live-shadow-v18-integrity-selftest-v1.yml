      - "research_notes/jnu_private_composite_evidence_dual_control_20260908.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile v1.8 tools
        run: |
          python -m py_compile             scripts/jnu_risk_state_evidence_validation_v1_2.py             scripts/jnu_request_preparation_validation_v1_1.py             scripts/prepare_jnu_cloud_request_v1_1.py             scripts/build_jnu_cloud_forecast_input_v1_2.py             scripts/check_jnu_live_shadow_preflight_v1_2.py             scripts/register_jnu_operational_shadow_forecast_v1_7.py             scripts/register_jnu_operational_shadow_forecast_atomic_v4.py             scripts/score_jnu_operational_live_shadow_v1_6.py             scripts/selftest_jnu_live_shadow_v18_integrity.py

      - name: Validate v1.8 governance JSON
        run: |
          python -m json.tool config/jnu_cloud_request_draft_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_cloud_forecast_request_protocol_v1_3.json >/dev/null
          python -m json.tool config/jnu_cloud_request_preparation_protocol_v1_1.json >/dev/null
          python -m json.tool config/jnu_operational_framework_current_v1_8.json >/dev/null
          python -m json.tool config/jnu_operational_framework_current_v1_9.json >/dev/null
          python -m json.tool config/jnu_operational_live_shadow_prereg_v1_7.json >/dev/null
          python -m json.tool config/jnu_operational_live_shadow_implementation_v1_7.json >/dev/null
          python -m json.tool config/jnu_operational_live_shadow_v18_integrity_selftest_v1.json >/dev/null
          python -m json.tool config/jnu_exact_micro_contract_roll_calendar_v1.json >/dev/null
          python -m json.tool config/jnu_first_real_launch_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_exact_micro_realtime_entitlement_resolution_v1.json >/dev/null
          python -m json.tool config/jnu_exact_micro_entitled_source_adapter_contract_v1.json >/dev/null
          python -m json.tool config/jnu_ose_free_trial_onboarding_feasibility_v1.json >/dev/null
          python -m json.tool config/jnu_entitled_market_data_storage_boundary_v1.json >/dev/null
          python -m json.tool config/jnu_private_entitled_quote_bridge_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_entitled_live_shadow_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_lifecycle_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_launch_manifest_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_concurrency_dr_state_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_key_encrypted_backup_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_restore_authorization_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_production_key_custody_decision_matrix_v1.json >/dev/null
          python -m json.tool config/jnu_provider_term_readiness_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_production_key_custody_current_v1.json >/dev/null
          python -m json.tool config/jnu_provider_term_readiness_current_v1.json >/dev/null
          python -m json.tool config/jnu_provider_selection_shortlist_v1.json >/dev/null
          python -m json.tool config/jnu_term_evidence_attestation_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_real_backup_activation_manifest_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_provider_evidence_intake_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_provider_evidence_intake_pack_templates_v1.json >/dev/null
          python -m json.tool config/jnu_private_provider_term_evidence_staging_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_kms_deployment_evidence_staging_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_composite_production_readiness_join_protocol_v1.json >/dev/null
          python -m json.tool config/jnu_private_composite_evidence_review_dual_control_protocol_v1.json >/dev/null

      - name: Install private backup crypto dependency
        run: python -m pip install "cryptography>=42"

      - name: First-real rollover and source readiness selftests
        run: |
          python -m py_compile             scripts/resolve_jnu_exact_micro_contract_v1.py             scripts/selftest_jnu_exact_micro_contract_roll_v1.py             scripts/probe_jnu_first_real_source_readiness_v1.py             scripts/selftest_jnu_first_real_source_readiness_v1.py
          python scripts/selftest_jnu_exact_micro_contract_roll_v1.py
          python scripts/selftest_jnu_first_real_source_readiness_v1.py

      - name: JNU v1.9 framework supersession selftest
        run: |
          python -m py_compile scripts/selftest_jnu_framework_v19_supersession.py
          python scripts/selftest_jnu_framework_v19_supersession.py

      - name: Entitled exact-Micro evidence contract selftest
        run: |
          python -m py_compile scripts/validate_jnu_entitled_exact_micro_evidence_v1.py scripts/selftest_jnu_entitled_exact_micro_evidence_v1.py
          python scripts/selftest_jnu_entitled_exact_micro_evidence_v1.py

      - name: Entitled market-data private boundary selftest
        run: |
          python -m py_compile scripts/validate_jnu_entitled_market_data_storage_boundary_v1.py scripts/selftest_jnu_entitled_market_data_storage_boundary_v1.py
          python scripts/selftest_jnu_entitled_market_data_storage_boundary_v1.py

      - name: Public live-shadow boundary selftests
        run: |
          python -m py_compile scripts/validate_jnu_public_live_shadow_boundary_v1.py scripts/selftest_jnu_public_live_shadow_boundary_v1.py scripts/check_jnu_public_artifact_safety_v1.py scripts/selftest_jnu_public_artifact_safety_v1.py
          python scripts/selftest_jnu_public_live_shadow_boundary_v1.py
          python scripts/selftest_jnu_public_artifact_safety_v1.py

      - name: Private entitled quote bridge synthetic selftest
        run: |
          python -m py_compile scripts/build_jnu_private_entitled_quote_bundle_v1.py scripts/selftest_jnu_private_entitled_quote_bridge_v1.py
          python scripts/selftest_jnu_private_entitled_quote_bridge_v1.py

      - name: Private entitled live-shadow synthetic selftest
        run: |
          python -m py_compile scripts/register_jnu_private_entitled_forecast_v1.py scripts/record_jnu_private_entitled_outcome_v1.py scripts/score_jnu_private_entitled_live_shadow_v1.py scripts/selftest_jnu_private_entitled_live_shadow_v1.py
          python scripts/selftest_jnu_private_entitled_live_shadow_v1.py

      - name: Private lifecycle idempotency recovery retention selftest
        run: |
          python -m py_compile scripts/jnu_private_atomic_io_v1.py scripts/validate_jnu_private_launch_manifest_v1.py scripts/launch_jnu_private_entitled_forecast_v1.py scripts/recover_jnu_private_entitled_ledger_v1.py scripts/retain_jnu_private_entitled_ledger_v1.py scripts/selftest_jnu_private_lifecycle_v1.py
          python scripts/selftest_jnu_private_lifecycle_v1.py

      - name: Private concurrency DR state-machine selftest
        run: |
          python -m py_compile scripts/jnu_private_lock_v1.py scripts/jnu_private_launch_state_v1.py scripts/export_jnu_private_backupset_v1.py scripts/import_jnu_private_backupset_v1.py scripts/selftest_jnu_private_concurrency_dr_state_v1.py
          python scripts/selftest_jnu_private_concurrency_dr_state_v1.py

      - name: Private encrypted backup key-rotation DR-drill selftest
        run: |
          python -m py_compile scripts/jnu_private_keyring_v1.py scripts/jnu_private_backup_crypto_v1.py scripts/validate_jnu_private_restore_authorization_v1.py scripts/export_jnu_private_encrypted_backupset_v1.py scripts/import_jnu_private_encrypted_backupset_v1.py scripts/rotate_jnu_private_encrypted_backups_v1.py scripts/run_jnu_private_encrypted_dr_drill_v1.py scripts/selftest_jnu_private_encrypted_backup_v1.py
          python scripts/selftest_jnu_private_encrypted_backup_v1.py

      - name: Production key-custody and provider-term readiness selftest
        run: |
          python -m py_compile scripts/evaluate_jnu_production_key_custody_provider_readiness_v1.py scripts/selftest_jnu_production_key_custody_provider_readiness_v1.py
          python scripts/selftest_jnu_production_key_custody_provider_readiness_v1.py
          python scripts/evaluate_jnu_production_key_custody_provider_readiness_v1.py --key-profile config/jnu_production_key_custody_current_v1.json --provider-terms config/jnu_provider_term_readiness_current_v1.json --report-only

      - name: Provider shortlist term-attestation activation selftest
        run: |
          python -m py_compile scripts/evaluate_jnu_provider_selection_shortlist_v1.py scripts/attest_jnu_provider_term_evidence_v1.py scripts/generate_jnu_real_backup_activation_manifest_v1.py scripts/selftest_jnu_provider_selection_term_activation_v1.py
          python scripts/selftest_jnu_provider_selection_term_activation_v1.py
          python scripts/evaluate_jnu_provider_selection_shortlist_v1.py

      - name: Provider evidence-intake pack selftest
        run: |
          python -m py_compile scripts/validate_jnu_provider_evidence_intake_pack_v1.py scripts/selftest_jnu_provider_evidence_intake_v1.py
          python scripts/selftest_jnu_provider_evidence_intake_v1.py
          python scripts/validate_jnu_provider_evidence_intake_pack_v1.py

      - name: Private external provider-term evidence staging selftest
        run: |
          python -m py_compile scripts/stage_jnu_private_provider_term_evidence_v1.py scripts/emit_jnu_redacted_provider_term_attestation_v1.py scripts/selftest_jnu_private_provider_term_evidence_staging_v1.py
          python scripts/selftest_jnu_private_provider_term_evidence_staging_v1.py

      - name: Private KMS deployment evidence staging selftest
        run: |
          python -m py_compile scripts/stage_jnu_private_kms_deployment_evidence_v1.py scripts/emit_jnu_redacted_kms_deployment_control_attestation_v1.py scripts/selftest_jnu_private_kms_deployment_evidence_v1.py
          python scripts/selftest_jnu_private_kms_deployment_evidence_v1.py

      - name: Private composite production-readiness evidence join selftest
        run: |
          python -m py_compile scripts/evaluate_jnu_private_composite_production_readiness_v1.py scripts/selftest_jnu_private_composite_production_readiness_v1.py
          python scripts/selftest_jnu_private_composite_production_readiness_v1.py

      - name: Private composite evidence dual-control review selftest
        run: |
          python -m py_compile scripts/review_jnu_private_composite_evidence_dual_control_v1.py scripts/selftest_jnu_private_composite_evidence_dual_control_v1.py
          python scripts/selftest_jnu_private_composite_evidence_dual_control_v1.py

      - name: Full v1.8 analysis-fresh chain selftest
        run: python scripts/selftest_jnu_live_shadow_v18_integrity.py

      - name: Real empty-ledger scorer integrity
        run: |
          python scripts/score_jnu_operational_live_shadow_v1_6.py --output /tmp/v18_empty.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/v18_empty.json"))
          assert x["version"]=="1.6"
          assert x["integrity"]["status"]=="PASS"
          assert x["integrity"]["analysis_draft_recomputed"] is True
          assert x["forecast_records"]==0 and x["outcomes_recorded"]==0
          print(json.dumps({"status":"V1_8_EMPTY_LEDGER_PASS","forecasts":0,"outcomes":0},indent=2))
          PY
