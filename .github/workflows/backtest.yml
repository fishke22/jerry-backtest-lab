name: Jerry Backtest Worker

on:
  push:
    paths:
      - "requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jerry-backtest-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set cache date
        shell: bash
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-data-${{ runner.os }}-${{ env.CACHE_DATE }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process pending requests
        run: python scripts/process_requests.py

      - name: Commit results
        shell: bash
        run: |
          git add results reports
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "backtest: publish results"
          git push
