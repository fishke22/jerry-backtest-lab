name: JNU Evidence Phase4B

on:
  push:
    paths:
      - "phase4b_requests/*.json"
  pull_request:
    paths:
      - "phase4b_requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jnu-evidence-phase4b
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Set cache date
        shell: bash
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Restore exact market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-data-${{ runner.os }}-${{ env.CACHE_DATE }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phase4B evidence tests
        id: phase4brun
        shell: bash
        run: |
          mkdir -p workflow_diagnostics
          set +e
          python scripts/process_phase4b_evidence.py 2>&1 | tee workflow_diagnostics/jnu_v22_phase4b_v1.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '{"workflow":"jnu-phase4b","exit_code":%s,"run_id":"%s","sha":"%s"}\n' "$code" "${{ github.run_id }}" "${{ github.sha }}" > workflow_diagnostics/jnu_v22_phase4b_v1.json
          exit 0
      - name: Commit results and diagnostics
        shell: bash
        run: |
          git add phase4b_results phase4b_reports workflow_diagnostics
          if git diff --cached --quiet; then
            echo "No new Phase4B results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish JNU Phase4B evidence results"
          branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: Fail workflow if processor failed
        if: steps.phase4brun.outputs.exit_code != '0'
        shell: bash
        run: exit 1
