name: JNU Evidence Phase4B

on:
  push:
    paths:
      - "phase4b_requests/*.json"
  pull_request:
    paths:
      - "phase4b_requests/*.json"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Restore cumulative Phase4B market-data cache
        id: phase4b-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/market-data
          key: phase4b-gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            phase4b-gdelt-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phase4B evidence tests
        id: phase4brun
        shell: bash
        run: |
          mkdir -p workflow_diagnostics
          set +e
          log="workflow_diagnostics/jnu_v22_phase4b_v1_${{ github.run_id }}.log"
          diag="workflow_diagnostics/jnu_v22_phase4b_v1_${{ github.run_id }}.json"
          python scripts/process_phase4b_evidence.py 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '{"workflow":"jnu-phase4b","exit_code":%s,"run_id":"%s","sha":"%s"}\n' "$code" "${{ github.run_id }}" "${{ github.sha }}" > "$diag"
          exit 0
      - name: Save cumulative Phase4B market-data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/market-data
          key: phase4b-gdelt-${{ runner.os }}-${{ github.run_id }}
      - name: Commit results and diagnostics
        shell: bash
        run: |
          git add workflow_diagnostics
          if [ -d phase4b_results ]; then git add phase4b_results; fi
          if [ -d phase4b_reports ]; then git add phase4b_reports; fi
          if git diff --cached --quiet; then
            echo "No new Phase4B results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish JNU Phase4B evidence results"
          branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: Fail workflow if processor failed
        if: steps.phase4brun.outputs.exit_code != '0'
        shell: bash
        run: exit 1
