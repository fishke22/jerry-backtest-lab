name: JNU NikkeiRealtime WS Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jnu-nikkeirealtime-ws-probe-v1.yml"
      - "scripts/probe_nikkeirealtime_micro_ws_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only WebSocket client
        run: python -m pip install --disable-pip-version-check "websockets==15.0.1"
      - name: Probe public exact-Micro WebSocket
        run: python scripts/probe_nikkeirealtime_micro_ws_v1.py | tee ws_probe.stdout.txt
      - name: Upload raw protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jnu-nikkeirealtime-ws-probe-${{ github.run_id }}
          path: |
            ws_probe.stdout.txt
            nikkeirealtime_ws_probe.json
            nikkeirealtime_ws_raw.jsonl
          if-no-files-found: ignore
          retention-days: 14
