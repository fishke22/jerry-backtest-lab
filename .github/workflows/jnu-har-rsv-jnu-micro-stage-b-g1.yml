name: JNU HAR-RSV Exact Micro Stage B

on:
  workflow_dispatch:

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pandas
      - run: python scripts/process_jnu_har_rsv_jnu_micro_stage_b_g1.py
      - uses: actions/upload-artifact@v4
        with:
          name: jnu-har-rsv-jnu-micro-stage-b
          path: |
            volatility_results/jnu_har_rsv_jnu_micro_stage_b_g1.json
            volatility_reports/jnu_har_rsv_jnu_micro_stage_b_g1.md
