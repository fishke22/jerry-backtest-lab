name: JNU Final Completion Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/jnu_final_completion_audit_prereg_v1.json"
      - "config/jnu_framework_completion_criteria_v1.json"
      - "config/jnu_family_attempt_ledger.json"
      - "config/jnu_framework_completion_gap_20260902.json"
      - "framework_status/jnu_framework_current_status_v1.json"
      - "stage9_results/jnu_stage9_role_validation_v1.json"
      - "scripts/audit_jnu_final_completion_v1.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed final completion audit
        run: python scripts/audit_jnu_final_completion_v1.py
      - name: Publish audit summary
        run: cat final_audit/jnu_final_completion_audit_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: jnu-final-completion-audit-${{ github.run_id }}
          path: |
            final_audit/jnu_final_completion_audit_v1.json
            final_audit/jnu_final_completion_audit_v1.md
          if-no-files-found: error
          retention-days: 30
