name: JNU Momentum Reversion Mini Stage A One Shot

on:
  push:
    paths:
      - cloud_data/triggers/jnu_momrev_mini_stage_a_g1.trigger

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/process_jnu_momrev_true_ose_mini_stage_a_g1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jnu-momrev-mini-stage-a-one-shot
          path: |
            directional_results/jnu_momrev_true_ose_mini_stage_a_g1.json
            directional_reports/jnu_momrev_true_ose_mini_stage_a_g1.md
          if-no-files-found: ignore
