name: JNU V2.2 Daily Proxy Suite

on:
  push:
    paths:
      - "suite_requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jnu-v22-daily-proxy-suite
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set cache date
        shell: bash
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-data-${{ runner.os }}-${{ env.CACHE_DATE }}
          restore-keys: |
            market-data-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process JNU V2.2 suite requests
        run: python scripts/process_jnu_suite.py

      - name: Commit suite results
        shell: bash
        run: |
          git add suite_results suite_reports
          if git diff --cached --quiet; then
            echo "No new suite results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish JNU V2.2 suite results"
          git push
