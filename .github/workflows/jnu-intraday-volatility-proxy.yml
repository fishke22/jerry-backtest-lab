name: JNU Intraday Volatility Proxy

# Historical proxy-method family is resolved. Keep manual audit replay only;
# new volatility families own their own exact trigger paths.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Restore pinned intraday source cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: jpxjpy-proxy-${{ runner.os }}-7ba1d404aa8b
          restore-keys: |
            jpxjpy-proxy-${{ runner.os }}-
            market-data-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run preregistered volatility proxy validation
        id: volrun
        shell: bash
        run: |
          mkdir -p workflow_diagnostics
          set +e
          python scripts/process_jnu_intraday_volatility_proxy.py 2>&1 | tee workflow_diagnostics/jnu_intraday_volatility_proxy_v1.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '{"workflow":"jnu-intraday-volatility-proxy","exit_code":%s,"run_id":"%s","sha":"%s"}\n' "$code" "${{ github.run_id }}" "${{ github.sha }}" > workflow_diagnostics/jnu_intraday_volatility_proxy_v1.json
          exit 0
      - name: Commit derived data, results and diagnostics
        shell: bash
        run: |
          git add volatility_results volatility_reports cloud_data/derived cloud_data/manifests workflow_diagnostics
          if git diff --cached --quiet; then
            echo "No new volatility results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish JNU intraday volatility proxy result"
          branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
      - name: Fail workflow if processor failed
        if: steps.volrun.outputs.exit_code != '0'
        shell: bash
        run: exit 1
