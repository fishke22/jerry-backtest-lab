name: Nautilus Second Engine

on:
  push:
    paths:
      - "nautilus_requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jnu-nautilus-second-engine
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-nautilus.txt"

      - name: Set cache date
        shell: bash
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore exact market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-data-${{ runner.os }}-${{ env.CACHE_DATE }}

      - name: Install NautilusTrader
        run: pip install -r requirements-nautilus.txt

      - name: Run second-engine validation
        run: python scripts/process_nautilus_second_engine.py

      - name: Commit second-engine results
        shell: bash
        run: |
          git add nautilus_results nautilus_reports
          if git diff --cached --quiet; then
            echo "No new Nautilus results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish Nautilus second-engine results"
          git push
