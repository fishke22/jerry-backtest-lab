name: JNU BOJ MPM Stage5 Nautilus Execution Replay G1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/jnu-boj-mpm-stage5-nautilus-replay-g1.yml"

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-nautilus.txt"
      - run: pip install -r requirements-nautilus.txt
      - run: python scripts/replay_jnu_boj_mpm_stage5_nautilus_g1.py
      - uses: actions/upload-artifact@v4
        with:
          name: jnu-boj-mpm-stage5-nautilus-replay-g1
          path: |
            stage5_results/jnu_boj_mpm_stage5_nautilus_execution_replay_g1.json
            stage5_reports/jnu_boj_mpm_stage5_nautilus_execution_replay_g1.md
