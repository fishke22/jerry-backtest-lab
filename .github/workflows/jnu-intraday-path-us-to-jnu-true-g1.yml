name: JNU True Prior-SPX Intraday Path G1

on:
  workflow_dispatch:

jobs:
  information-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pandas
      - run: python scripts/process_jnu_intraday_path_us_to_jnu_true_g1.py
      - uses: actions/upload-artifact@v4
        with:
          name: jnu-true-prior-spx-intraday-path-g1
          path: |
            intraday_path_results/jnu_intraday_path_us_to_jnu_true_g1.json
            intraday_path_reports/jnu_intraday_path_us_to_jnu_true_g1.md
