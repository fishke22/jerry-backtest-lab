name: JNU Official Event Source Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jnu-official-event-source-smoke-v1.yml"
      - "scripts/fetch_jnu_official_event_state_v1.py"
      - "scripts/selftest_jnu_official_event_state_v1.py"
      - "config/jnu_official_event_state_protocol_v1.json"
  workflow_dispatch:
    inputs:
      target_day_session_date:
        description: "Target OSE day-session date"
        required: false
        default: "2026-09-07"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run offline parser and state regression
        run: python scripts/selftest_jnu_official_event_state_v1.py

      - name: Resolve target date
        id: target
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target_day_session_date }}
        run: |
          if [ -n "${INPUT_TARGET:-}" ]; then
            target="$INPUT_TARGET"
          else
            target="2026-09-07"
          fi
          echo "date=$target" >> "$GITHUB_OUTPUT"

      - name: Probe official event sources fail closed
        id: probe
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set +e
          python scripts/fetch_jnu_official_event_state_v1.py \
            --target-day-session-date "$TARGET_DATE" \
            --output official_event_state_smoke.json \
            > official_event_state.stdout 2> official_event_state.stderr
          ec=$?
          set -e
          echo "adapter_exit=$ec" >> "$GITHUB_OUTPUT"
          test -f official_event_state_smoke.json
          cat official_event_state.stdout
          cat official_event_state.stderr >&2 || true

      - name: Verify source feasibility semantics
        shell: bash
        env:
          ADAPTER_EXIT: ${{ steps.probe.outputs.adapter_exit }}
        run: |
          python - "$ADAPTER_EXIT" <<'PY'
          import json, sys
          from pathlib import Path

          exit_code=int(sys.argv[1])
          x=json.loads(Path("official_event_state_smoke.json").read_text(encoding="utf-8"))
          records={r["source"]:r for r in x.get("risk_state_evidence",{}).get("event_sources",[])}
          failures=x.get("source_failures",[])
          required={
            "BOJ_RELEASE_SCHEDULE",
            "JAPAN_STAT_CPI",
            "JAPAN_STAT_LABOUR_FORCE",
            "JAPAN_STAT_HOUSEHOLD_SPENDING",
            "JAPAN_ESRI_GENERAL",
            "JAPAN_ESRI_GDP",
            "US_BLS_RELEASE_CALENDAR",
            "US_BEA_RELEASE_SCHEDULE",
            "FEDERAL_RESERVE_CALENDAR",
          }
          non_bls=required-{"US_BLS_RELEASE_CALENDAR"}
          missing_non_bls=sorted(non_bls-set(records))
          assert not missing_non_bls, f"required non-BLS official sources missing: {missing_non_bls}"
          assert all(int(records[s]["http_status"])==200 for s in non_bls)
          assert all(int(records[s]["parsed_event_count"])>0 for s in non_bls)

          bls_ok="US_BLS_RELEASE_CALENDAR" in records
          if bls_ok:
            assert int(records["US_BLS_RELEASE_CALENDAR"]["http_status"])==200
            assert int(records["US_BLS_RELEASE_CALENDAR"]["parsed_event_count"])>0
            assert not any(f.get("source_id")=="US_BLS_RELEASE_CALENDAR" for f in failures)
            assert x["event_state"] in {"NORMAL","PRE_RELEASE_HIGH","POST_EVENT_HIGH","UNKNOWN"}
            assert exit_code in {0,3}
            transport="BLS_OFFICIAL_TRANSPORT_AVAILABLE"
          else:
            b=[f for f in failures if f.get("source_id")=="US_BLS_RELEASE_CALENDAR"]
            assert len(b)==1, f"expected one explicit BLS failure, got: {b}"
            if x.get("future_high_events"):
              assert x["event_state"]=="PRE_RELEASE_HIGH"
              assert exit_code==0
            else:
              assert x["event_state"]=="UNKNOWN", "missing BLS with no independently known future high event must fail closed UNKNOWN"
              assert exit_code==3
            transport="BLS_OFFICIAL_TRANSPORT_BLOCKED"

          other_failures=[f for f in failures if f.get("source_id")!="US_BLS_RELEASE_CALENDAR"]
          assert not other_failures, f"unexpected official source failures: {other_failures}"

          summary={
            "status":"OFFICIAL_EVENT_SOURCE_SMOKE_PASS",
            "target_day_session_date":x["target_day_session_date"],
            "source_records":len(records),
            "source_failures":len(failures),
            "bls_transport":transport,
            "event_state":x["event_state"],
            "adapter_exit":exit_code,
            "real_registration_performed":x.get("real_registration_performed"),
          }
          Path("official_event_source_smoke_summary.json").write_text(
              json.dumps(summary,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload source smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jnu-official-event-source-smoke-${{ github.run_id }}
          path: |
            official_event_state_smoke.json
            official_event_state.stdout
            official_event_state.stderr
            official_event_source_smoke_summary.json
          if-no-files-found: ignore
          retention-days: 30
