name: JNU News Language Source G1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "news_language_g1_requests/jnu_news_language_source_g1_v1.json"
  workflow_dispatch:

concurrency:
  group: jnu-news-g1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  acquire_attempt3:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'research/news-language-source-g1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 43
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stage:
          - { cell: JAPAN_MACRO_JA, mode: TimelineTone }
          - { cell: JAPAN_MACRO_JA, mode: TimelineVol }
          - { cell: JAPAN_MACRO_EN, mode: TimelineTone }
          - { cell: JAPAN_MACRO_EN, mode: TimelineVol }
          - { cell: JAPAN_EQUITY_JA, mode: TimelineTone }
          - { cell: JAPAN_EQUITY_JA, mode: TimelineVol }
          - { cell: JAPAN_EQUITY_EN, mode: TimelineTone }
          - { cell: JAPAN_EQUITY_EN, mode: TimelineVol }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Restore cumulative G1 news cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/market-data
          key: g1-news-${{ runner.os }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: |
            g1-news-${{ runner.os }}-${{ github.run_id }}-
            g1-news-${{ runner.os }}-
            phase4b-gdelt-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run JNU data-integrity selftest
        run: python scripts/selftest_jnu_data_integrity.py
      - name: Acquire one frozen G1 cell/mode stage
        env:
          G1_CELL: ${{ matrix.stage.cell }}
          G1_MODE: ${{ matrix.stage.mode }}
          G1_STAGE_BUDGET_SECONDS: "2400"
          G1_STAGE_RESERVE_SECONDS: "150"
        run: python scripts/acquire_jnu_news_language_source_g1_stage.py
      - name: Save cumulative G1 news cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/market-data
          key: g1-news-${{ runner.os }}-${{ github.run_id }}-${{ strategy.job-index }}
      - name: Commit acquisition diagnostic
        if: always()
        shell: bash
        run: |
          git add workflow_diagnostics
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: checkpoint G1 attempt3 ${{ matrix.stage.cell }} ${{ matrix.stage.mode }}"
          branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

  finalize_attempt3:
    needs: acquire_attempt3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Restore final cumulative G1 cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/market-data
          key: g1-news-final-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            g1-news-${{ runner.os }}-${{ github.run_id }}-
            g1-news-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run JNU data-integrity selftest
        run: python scripts/selftest_jnu_data_integrity.py
      - name: Offline completeness gate and frozen evaluation
        run: python scripts/finalize_jnu_news_language_source_g1_attempt3.py
      - name: Commit terminal result and diagnostics
        shell: bash
        run: |
          git add workflow_diagnostics
          if [ -d news_language_g1_results ]; then git add news_language_g1_results; fi
          if [ -d news_language_g1_reports ]; then git add news_language_g1_reports; fi
          if [ -d cloud_data/derived ]; then git add cloud_data/derived; fi
          if [ -d cloud_data/manifests ]; then git add cloud_data/manifests; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish terminal G1-DI1 attempt3 result"
          branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
