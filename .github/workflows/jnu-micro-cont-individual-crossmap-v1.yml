name: JNU Micro CONT Individual Crossmap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jnu-micro-cont-individual-crossmap-v1.yml"
      - "scripts/probe_jnu_micro_cont_individual_crossmap_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only WebSocket client
        run: python -m pip install --disable-pip-version-check "websockets==15.0.1"
      - name: Cross-map current Sep Micro to CONT history
        run: python scripts/probe_jnu_micro_cont_individual_crossmap_v1.py | tee crossmap.stdout.txt
      - name: Upload cross-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jnu-micro-cont-individual-crossmap-${{ github.run_id }}
          path: |
            crossmap.stdout.txt
            jnu_micro_crossmap_probe.json
          if-no-files-found: ignore
          retention-days: 14
