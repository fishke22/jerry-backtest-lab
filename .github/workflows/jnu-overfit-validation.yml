name: JNU Overfit Risk Validation

on:
  push:
    paths:
      - "overfit_requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jnu-overfit-risk-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set cache date
        shell: bash
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore exact market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/market-data
          key: market-data-${{ runner.os }}-${{ env.CACHE_DATE }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run overfit validation
        run: python scripts/process_overfit_validation.py

      - name: Commit validation results
        shell: bash
        run: |
          git add overfit_results overfit_reports
          if git diff --cached --quiet; then
            echo "No new overfit results."
            exit 0
          fi
          git config user.name "jerry-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "research: publish overfit risk validation"
          git push
